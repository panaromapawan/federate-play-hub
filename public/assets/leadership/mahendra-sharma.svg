<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#bg)"/>
  <rect width="600" height="750" fill="url(#glow)"/>
  
  <!-- Outer Frame -->
  <rect x="30" y="30" width="540" height="690" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <rect x="40" y="40" width="520" height="670" rx="12" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="1"/>
  
  <!-- Top Badge Ribbon -->
  <g transform="translate(60, 60)">
    <rect width="160" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="80" y="18" text-anchor="middle" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">EXECUTIVE BOARD</text>
  </g>

  <!-- Central Silhouette and Crest -->
  <g transform="translate(300, 260)">
    <!-- Aura rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
    <circle cx="0" cy="0" r="120" fill="rgba(16,185,129,0.06)" stroke="#10b981" stroke-opacity="0.4" stroke-width="2"/>
    
    <!-- Executive Profile Silhouette -->
    <circle cx="0" cy="-25" r="46" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <path d="M-65 70 C-65 20, 65 20, 65 70 Z" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <polygon points="0,25 -14,60 14,60" fill="#38bdf8"/>

    <!-- Monogram Overlay -->
    <text x="0" y="-14" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="2">DMS</text>
  </g>

  <!-- Bottom Details Panel -->
  <g transform="translate(300, 500)">
    <rect x="-240" y="0" width="480" height="180" rx="12" fill="rgba(2,6,23,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Gold Trim Indicator -->
    <line x1="-200" y1="12" x2="200" y2="12" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Name -->
    <text x="0" y="52" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="800">Dr. Mahendra Sharma</text>
    
    <!-- Role -->
    <text x="0" y="84" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="1">Secretary General</text>
    
    <!-- Accreditations -->
    <text x="0" y="118" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Inter-District Scheduling &amp; Governance</text>
    <text x="0" y="142" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">RAJASTHAN SEPAK TAKRAW ASSOCIATION</text>
  </g>
</svg>
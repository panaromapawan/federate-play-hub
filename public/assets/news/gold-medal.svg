<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="newsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="radialAccent" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="courtPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#newsBg)"/>
  <rect width="1200" height="675" fill="url(#radialAccent)"/>
  <rect width="1200" height="675" fill="url(#courtPattern)"/>
  
  <!-- Geometric Sports Accents -->
  <g transform="translate(850, 320)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="2"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="4" stroke-dasharray="15,10"/>
    
    <!-- Sport Motif -->
    <polygon points="0,-80 70,40 -70,40" fill="none" stroke="#f59e0b" stroke-width="5"/>
    <circle cx="0" cy="0" r="35" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900">RSTA</text>
  </g>

  <!-- Content Overlay -->
  <g transform="translate(80, 140)">
    <!-- Category Badge -->
    <rect width="190" height="34" rx="8" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="95" y="22" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">CHAMPIONSHIP VICTORY</text>
    
    <!-- Headline -->
    <text x="0" y="110" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      <tspan x="0" dy="0">Historic National Gold </tspan>
      <tspan x="0" dy="55" fill="#f59e0b"> Rajasthan Sepak Takraw Regu</tspan>
    </text>

    <!-- Sub-info -->
    <g transform="translate(0, 260)">
      <circle cx="8" cy="8" r="6" fill="#f59e0b"/>
      <text x="26" y="12" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="600">2026-03-12 • Sawai Mansingh Stadium, Jaipur</text>
      <text x="0" y="50" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2">RAJASTHAN SEPAK TAKRAW ASSOCIATION OFFICIAL DISPATCH</text>
    </g>
  </g>
</svg>